# devopsy config: see devopsy-cli's README, "Remote targets". Committed: no
# secrets and no servers here. The server comes from the address
# (devopsy @vm1:prod), or DEVOPSY_SERVER (or DEVOPSY_SERVER_<ENVIRONMENT>) in
# .devopsy/.env or the environment, like DEVOPSY_SERVER=devopsy@203.0.113.10.
# Each environment lives in <project>/<environment> under the server's
# release root, and gets <project>-<environment>.<server's wildcard domain>,
# imported from the server's proxy at each release (compose.yaml's
# devopsy.import label); override it, or set it empty for none, with:
#   devopsy @prod --vars set --show DEVOPSY_WILDCARD_DOMAIN
# Build mode, devopsy's default: a release uploads the whole project and the
# image is built on the server.
project: drupal11
defaults:
  release: {prepare: secrets, run: deploy}
  rollback: {prepare: secrets, run: deploy}
  destroy: destroy
environments:
  # inherit: variables every child gets from prod's server files, on its
  # first release and every clone (devopsy-cli's README, "Parent
  # environments and clones"): SITE_BASIC_AUTH, so copies of a closed site
  # stay closed, with prod's login. Unset on prod, nothing is written. For
  # a raw copy of the database (compose.yaml, devopsy.clone=stop on it),
  # add DB_PASSWORD: the copied datadir has prod's password.
  prod:
    inherit: [SITE_BASIC_AUTH]
  # Children: cloned from prod on their first release, before deploy, and
  # again with `devopsy @dev --clone`. Files are copied, the database is
  # dumped (capabilities/clone/push); each keeps its own shared/.env.
  dev: {parent: prod}
  "pr-*":                         # pull request environments: @pr-123
    parent: prod
    releases: {keep: 1}
