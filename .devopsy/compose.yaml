# Drupal 11 behind devopsy-template-traefik: the app image is built from this project
# (on the server, with targets in build mode), MariaDB keeps the data.
#
# DB_PASSWORD and DRUPAL_HASH_SALT are secrets in .devopsy/.env (on servers
# shared/.env). `devopsy secrets` generates them (a release runs it before going live).
services:
  app:
    build:
      context: ..
      dockerfile: .devopsy/Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
    restart: unless-stopped
    # No privilege at all, from the first process: its own UID (APP_UID,
    # never root, never 1000, the deploy user on servers), no capabilities
    # (it listens on 8080; the Dockerfile removes FrankenPHP's file
    # capability and every setuid binary) and none to gain. `compose exec`
    # runs as this user too, and as --user 0 is a root without
    # capabilities. devopsy gives the mounts to it (devopsy.mnt.owner).
    user: ${APP_UID:-10001}:${APP_UID:-10001}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    read_only: true
    # The only writable paths: /tmp (also Caddy's data, see the Dockerfile)
    # and the storage and logs mounts.
    tmpfs:
      - /tmp
    environment:
      DB_HOST: database
      DB_NAME: drupal
      DB_USER: drupal
      DB_PASSWORD: ${DB_PASSWORD:?run devopsy secrets to generate it}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:?run devopsy secrets to generate it}
      # Optional HTTP basic auth for the whole site, user:password (in .env,
      # on servers shared/.env): docker/Caddyfile.
      SITE_BASIC_AUTH: ${SITE_BASIC_AUTH:-}
      # What the healthcheck below requests, set here once: docker/Caddyfile
      # keeps it out of the access log. A static file, so Caddy answers.
      HEALTHCHECK_PATH: ${HEALTHCHECK_PATH:-/robots.txt}
      # drush's URL (links, drush uli), from capabilities/env/compute.
      DRUSH_OPTIONS_URI: ${DRUSH_OPTIONS_URI:-${SITE_URL:-}}
      # The largest upload (and request body) PHP takes: docker/php.ini.
      PHP_UPLOAD_MAX_SIZE: ${PHP_UPLOAD_MAX_SIZE:-32M}
    volumes:
      - ./mnt/storage:/app/storage
      # The access log, in a mount of its own: not part of the site's files.
      - ./mnt/logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # Caddy only: Drupal answers with a redirect until it is installed.
      # HEALTHCHECK_PATH, the app's environment above.
      test: [CMD-SHELL, 'curl -fsS -o /dev/null "http://localhost:8080$$HEALTHCHECK_PATH"']
      interval: 10s
      start_period: 30s
      start_interval: 1s
    labels:
      # devopsy --shell: bash here by default, as the service's user.
      - devopsy.shell=true
      # devopsy creates the mounts' entries (storage, logs) and gives them
      # to the app's user at every release, whatever owner their files
      # arrived with (a sync, an import, a copy by hand). Keep it in step
      # with user: above.
      - devopsy.mnt.owner=${APP_UID:-10001}:${APP_UID:-10001}
      # Each release gets the server's wildcard domain from its proxy
      # (devopsy-template-traefik exports it), for <project>-<environment>.<domain>. Without a
      # proxy running the release fails: the project expects one.
      - devopsy.import.DEVOPSY_WILDCARD_DOMAIN=proxy/WILDCARD_DOMAIN
      - traefik.enable=true
      # SITE_HOST_RULE: the target's DEVOPSY_DOMAINS plus
      # <compose project>.<DEVOPSY_WILDCARD_DOMAIN>, computed by
      # capabilities/env/compute. The fallback, for plain docker compose, is
      # a HostRegexp: Traefik requests no certificate for it, so a target
      # without hosts logs no ACME errors.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.rule=${SITE_HOST_RULE:-HostRegexp(`^app\.localhost$`)}
      # letsencrypt1 (HTTP-01, the default), acmedns or cloudflare (DNS-01),
      # per target, in config.yaml.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.tls.certresolver=${CERTRESOLVER:-letsencrypt1}
      # The FrankenPHP image exposes several ports: tell Traefik which one.
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-app}.loadbalancer.server.port=8080
      # While this container is stopped, recreating or unhealthy, Traefik
      # has no router for it and the alwaysup service's (below, priority
      # 2) answers instead: it waits for the app and streams its answer,
      # or shows the maintenance page.
      # Data (syncs, --export, --import): its files are its entries of
      # mnt. import: it is down while any data is imported (a child's
      # sync, an --import of the database), so it never runs on a
      # half-loaded database (in-flight requests finish first, see
      # stop_grace_period; alwaysup answers meanwhile); its own files are
      # exported while it runs. With the database copied as files (own),
      # it also stops with it on both sides, depending on it.
      - devopsy.data=mnt
      - devopsy.data.stop=import
      # The access log stays the environment's own: never copied.
      - devopsy.data.exclude=logs
    # Stopping waits for Caddy to finish the requests in flight (a sync,
    # a deploy): Compose's default is 10s.
    stop_grace_period: 30s
    networks: [default, traefik]

  database:
    # Pinned exactly: a server keeps the image it pulled first, and a
    # floating tag would run a different version per server, while a
    # sync copies the datadir raw from one to another (a downgrade is
    # unsupported). Bump it here; each server upgrades on its next
    # release, MARIADB_AUTO_UPGRADE updating the system tables on start.
    image: mariadb:11.8.9
    restart: unless-stopped
    # As the image's mysql user (999) from the first process, without
    # capabilities: its entrypoint only starts as root to chown the
    # datadir, which devopsy does instead (devopsy.mnt.owner below), and
    # skips that when started as its user.
    user: "999:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    read_only: true
    # The only writable paths: the datadir (below), /run/mysqld (its
    # socket and pid file, the mysql user's: a tmpfs is root's unless told
    # otherwise) and /tmp.
    tmpfs:
      - /run/mysqld:uid=999,gid=999,mode=755
      - /tmp
    environment:
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: ${DB_PASSWORD:?run devopsy secrets to generate it}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_AUTO_UPGRADE: "1"
    command: --max-allowed-packet=64M --transaction-isolation=READ-COMMITTED
    # A clean shutdown flushes InnoDB and checkpoints, longer than Docker's
    # 10s on a busy or big database; killed meanwhile, the datadir is a
    # crash image, recovered on the next start and copied as such by a
    # sync. Waited for by stop, down and releases alike.
    stop_grace_period: 2m
    volumes:
      - ./mnt/database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      start_period: 60s
      start_interval: 1s
    labels:
      # Data: DATA_DATABASE (set on prod, inherited by children so both
      # sides agree). mnt, the default: the datadir raw, with the database
      # stopped while its data moves (own: on both sides of a sync, around
      # its --export and --import), the app with it; consistent, prod down
      # for the copy. Never copy a running datadir: it is not a
      # consistent image. The datadir carries prod's users and passwords,
      # hence DB_PASSWORD in prod's inherit:. stream:
      # capabilities/data/export dumps the running database and
      # capabilities/data/import loads it (into a child's created with the
      # same, inherited, password); the database stays up
      # (capabilities/env/compute sets DATA_DATABASE_STOP to never), prod
      # and its app included, and the importing side's app is down for
      # the load. The same scripts serve devopsy @prod --export database >
      # dump.sql and devopsy --import database < dump.sql. none
      # (DATA_DATABASE=none) leaves the database out of every copy.
      - devopsy.data=${DATA_DATABASE:-mnt}
      - devopsy.data.stop=${DATA_DATABASE_STOP:-own}
      # The datadir is the mysql user's, created and kept so by devopsy.
      - devopsy.mnt.owner=999:999

  # alwaysup answers for the app while its router is gone: stopped for a
  # sync or a deploy, recreating, unhealthy. Caddy tries the app every
  # second for up to ALWAYSUP_WAIT (docker/alwaysup/Caddyfile) and streams
  # its answer, so visitors who arrive meanwhile get the real page, late;
  # when it does not come back in time, docker/alwaysup/index.html with
  # status 503 and Retry-After. In maintenance mode (`devopsy maintenance
  # on`: mnt/maintenance/on exists) the page shows at once. Its router has
  # the app's rule at priority 2, below the app's, so Traefik only sends
  # requests here while the app's router is gone: no middleman otherwise,
  # and nothing needed from the server's Traefik. No devopsy.data label,
  # and no depends_on on the app (it would stop with it): copies never
  # stop it, and never copy the flag. As APP_UID, read-only;
  # Caddy's directories are tmpfs, nothing is persisted.
  alwaysup:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    user: ${APP_UID:-10001}:${APP_UID:-10001}
    read_only: true
    # A tmpfs takes the mode of the directory it covers: /tmp is world
    # writable in the image, /data and /config are root's, so Caddy's
    # directories go under /tmp.
    tmpfs:
      - /tmp
    command: [caddy, run, --config, /alwaysup/Caddyfile, --adapter, caddyfile]
    environment:
      ALWAYSUP_WAIT: ${ALWAYSUP_WAIT:-60s}
      # The app by a name Docker's DNS only answers on this project's
      # network: a plain `app` is also an alias on the shared traefik
      # network, where every project's app carries it, and with ours
      # stopped it would resolve to another project's.
      ALWAYSUP_UPSTREAM: app.${COMPOSE_PROJECT_NAME:-drupal11}_default:8080
      XDG_DATA_HOME: /tmp/data
      XDG_CONFIG_HOME: /tmp/config
    healthcheck:
      test: ['CMD', 'wget', '-Y', 'off', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/']
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./docker/alwaysup:/alwaysup:ro
      # The maintenance mode flag (deploy creates the directory, as the
      # deploy user, so `devopsy maintenance` can write it).
      - ./mnt/maintenance:/flag:ro
    cap_drop:
      - ALL
    # The image's caddy binary carries this file capability, and execve
    # refuses a binary whose file capabilities the bounding set lacks:
    # without it the container dies with "operation not permitted".
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-alwaysup.rule=${SITE_HOST_RULE:-HostRegexp(`^app\.localhost$`)}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-alwaysup.tls.certresolver=${CERTRESOLVER:-letsencrypt1}
      # Below the app's router (a rule's length).
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-alwaysup.priority=2
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-alwaysup.service=${COMPOSE_PROJECT_NAME:-app}-alwaysup
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-app}-alwaysup.loadbalancer.server.port=8080
    networks: [default, traefik]

  # GoAccess for `devopsy goaccess`: it reads the access log files Caddy
  # writes in mnt/logs, as their owner, and prints a report. Never started
  # by `up`; pulled at its first use. Its settings: goaccess.conf.
  goaccess:
    profiles: [tools]
    image: allinurl/goaccess:1.12
    # The access log's owner: the files are mode 600.
    user: ${APP_UID:-10001}:${APP_UID:-10001}
    # Docker's own TERM for a terminal is xterm, 8 colors, where GoAccess
    # draws its time columns in black: unreadable on a dark background.
    # With 256 colors it uses a palette that shows on any.
    environment:
      TERM: xterm-256color
    network_mode: none
    read_only: true
    # GoAccess wants a writable working directory, even to print to stdout.
    working_dir: /tmp
    tmpfs:
      - /tmp
    volumes:
      - ./mnt/logs:/logs:ro
      - ./goaccess.conf:/etc/goaccess.conf:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges

  # jq for `devopsy accesslog`: it reads the access log on stdin. The
  # official image, nothing else in it; never started by `up`, pulled at
  # its first use.
  jq:
    profiles: [tools]
    image: ghcr.io/jqlang/jq:1.8.1
    user: ${APP_UID:-10001}:${APP_UID:-10001}
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges

networks:
  # Named from the project, so alwaysup's app.<project>_default upstream
  # holds under plain docker compose too (the default would be the
  # directory's name).
  default:
    name: ${COMPOSE_PROJECT_NAME:-drupal11}_default
  traefik:
    name: traefik
    external: true
