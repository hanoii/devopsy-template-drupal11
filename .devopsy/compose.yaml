# Drupal 11 behind devopsy-template-traefik: the app image is built from this project
# (on the server, with targets in build mode), MariaDB keeps the data.
#
# DB_PASSWORD and DRUPAL_HASH_SALT are secrets in .devopsy/.env (on servers
# shared/.env). `devopsy secrets` generates them (a release runs it before going live).
services:
  app:
    build:
      context: ..
      dockerfile: .devopsy/Dockerfile
    restart: unless-stopped
    # The entrypoint starts as root to own the storage mount, then drops to the
    # app user (UID 10001, set in the Dockerfile).
    read_only: true
    # The only writable paths: /tmp (also Caddy's data, see the Dockerfile)
    # and the storage and logs mounts.
    tmpfs:
      - /tmp
    environment:
      DB_HOST: database
      DB_NAME: drupal
      DB_USER: drupal
      DB_PASSWORD: ${DB_PASSWORD:?run devopsy secrets to generate it}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:?run devopsy secrets to generate it}
      # Optional HTTP basic auth for the whole site, user:password (in .env,
      # on servers shared/.env): docker/Caddyfile.
      SITE_BASIC_AUTH: ${SITE_BASIC_AUTH:-}
      # What the healthcheck below requests, set here once: docker/Caddyfile
      # keeps it out of the access log. A static file, so Caddy answers.
      HEALTHCHECK_PATH: ${HEALTHCHECK_PATH:-/robots.txt}
      # drush's URL (links, drush uli), from capabilities/env/compute.
      DRUSH_OPTIONS_URI: ${DRUSH_OPTIONS_URI:-${SITE_URL:-}}
    volumes:
      - ./mnt/storage:/app/storage
      # The access log, in a mount of its own: not part of the site's files.
      - ./mnt/logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # Caddy only: Drupal answers with a redirect until it is installed.
      # HEALTHCHECK_PATH, the app's environment above.
      test: [CMD-SHELL, 'curl -fsS -o /dev/null "http://localhost:8080$$HEALTHCHECK_PATH"']
      interval: 10s
      start_period: 30s
      start_interval: 1s
    labels:
      # devopsy --shell: bash here by default, as the app user (compose exec
      # skips the entrypoint, which drops from root to it).
      - devopsy.shell=true
      - devopsy.shell.user=app
      # Each release gets the server's wildcard domain from its proxy
      # (devopsy-template-traefik exports it), for <project>-<environment>.<domain>. Without a
      # proxy running the release fails: the project expects one.
      - devopsy.import.DEVOPSY_WILDCARD_DOMAIN=proxy/WILDCARD_DOMAIN
      - traefik.enable=true
      # SITE_HOST_RULE: the target's DEVOPSY_DOMAINS plus
      # <compose project>.<DEVOPSY_WILDCARD_DOMAIN>, computed by
      # capabilities/env/compute. The fallback, for plain docker compose, is
      # a HostRegexp: Traefik requests no certificate for it, so a target
      # without hosts logs no ACME errors.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.rule=${SITE_HOST_RULE:-HostRegexp(`^app\.localhost$`)}
      # letsencrypt1 (HTTP-01, the default), acmedns or cloudflare (DNS-01),
      # per target, in config.yaml.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.tls.certresolver=${CERTRESOLVER:-letsencrypt1}
      # The FrankenPHP image exposes several ports: tell Traefik which one.
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-app}.loadbalancer.server.port=8080
      # While the app answers 502 or 503 (starting, failing), the server's
      # Traefik holds the request (hold@file, its hold plugin: retried
      # until the app answers or the server's limit passes), then shows
      # the maintenance service's page instead (an errors middleware).
      # Both must exist: Traefik drops a router whose middleware is
      # missing, so this needs a devopsy-template-traefik with the plugin.
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-app}-maintenance.errors.status=502-503
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-app}-maintenance.errors.service=${COMPOSE_PROJECT_NAME:-app}-maintenance
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-app}-maintenance.errors.query=/
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.middlewares=hold@file,${COMPOSE_PROJECT_NAME:-app}-maintenance
      # Clones (devopsy @<child> --clone, and a child's first release):
      # CLONE_APP, from capabilities/env/compute: stopped on both sides
      # with the database for a raw copy (in-flight requests finish, see
      # stop_grace_period; the maintenance router answers meanwhile and
      # the server's Traefik holds requests until the app is back), live
      # for a dump.
      - devopsy.clone=${CLONE_APP:-stop}
      # The access log stays the environment's own: never copied.
      - devopsy.clone.exclude=logs
    # Stopping waits for Caddy to finish the requests in flight (a clone,
    # a deploy): Compose's default is 10s.
    stop_grace_period: 30s
    networks: [default, traefik]

  database:
    # Pinned exactly: a server keeps the image it pulled first, and a
    # floating tag would run a different version per server, while a
    # clone copies the datadir raw from one to another (a downgrade is
    # unsupported). Bump it here; each server upgrades on its next
    # release, MARIADB_AUTO_UPGRADE updating the system tables on start.
    image: mariadb:11.8.9
    restart: unless-stopped
    # The official image starts as root to own its data directory, then runs
    # as its own mysql user (999).
    environment:
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: ${DB_PASSWORD:?run devopsy secrets to generate it}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_AUTO_UPGRADE: "1"
    command: --max-allowed-packet=64M --transaction-isolation=READ-COMMITTED
    # A clean shutdown flushes InnoDB and checkpoints, longer than Docker's
    # 10s on a busy or big database; killed meanwhile, the datadir is a
    # crash image, recovered on the next start and copied as such by a
    # clone. Waited for by stop, down and releases alike.
    stop_grace_period: 2m
    volumes:
      - ./mnt/database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      start_period: 60s
      start_interval: 1s
    labels:
      # Clones: CLONE_DATABASE (set on prod, inherited by children so both
      # sides agree). stop, the default: devopsy rsyncs the datadir with
      # the database stopped on both sides, prod down for the copy; the
      # datadir carries prod's users and passwords, hence DB_PASSWORD in
      # prod's inherit:. custom: capabilities/clone/push dumps it from the
      # running parent into the child's database instead (created with
      # the same, inherited, password); prod stays up.
      # Never pause: a paused database flushes nothing.
      - devopsy.clone=${CLONE_DATABASE:-stop}

  # A page for when the app is stopped, unhealthy or failing: answered with
  # 503 for any request method (docker/maintenance). Its router has the
  # app's rule at priority 2: Traefik prefers the app's router, whose
  # priority is the rule's length, while the app runs and is healthy, and
  # only drops it when the app is stopped. Traefik's hold plugin retries
  # before showing the page: a stopped app until its router is back, an
  # unhealthy one until it answers (through the errors middleware above).
  # In maintenance mode (`devopsy maintenance on`: mnt/maintenance/on
  # exists) the page carries Retry-After and shows at once. No
  # devopsy.clone label: clones never stop it, and never copy the flag.
  # The image is the one devopsy-template-traefik's own page uses: nginx
  # built to run as a plain user, the slim variant.
  maintenance:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine-slim
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    # nginx directly: the image's entrypoint scripts edit its default
    # configuration, which this service does not use.
    entrypoint: [nginx, -c, /maintenance/nginx.conf, -g, "daemon off;"]
    volumes:
      - ./docker/maintenance:/maintenance:ro
      # The maintenance mode flag (deploy creates the directory, as the
      # deploy user, so `devopsy maintenance` can write it).
      - ./mnt/maintenance:/flag:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-maintenance.rule=${SITE_HOST_RULE:-HostRegexp(`^app\.localhost$`)}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-maintenance.tls.certresolver=${CERTRESOLVER:-letsencrypt1}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-maintenance.priority=2
      # Held too: a stopped app is a wait, the page only after the
      # server's hold limit, unless the page carries Retry-After
      # (`devopsy maintenance on`), which passes at once.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-maintenance.middlewares=hold@file
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}-maintenance.service=${COMPOSE_PROJECT_NAME:-app}-maintenance
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-app}-maintenance.loadbalancer.server.port=8080
    networks: [traefik]

  # GoAccess for `devopsy goaccess`: it reads the access log files Caddy
  # writes in mnt/logs, as their owner, and prints a report. Never started
  # by `up`; pulled at its first use. Its settings: goaccess.conf.
  goaccess:
    profiles: [tools]
    image: allinurl/goaccess:1.12
    user: "10001:10001"
    # Docker's own TERM for a terminal is xterm, 8 colors, where GoAccess
    # draws its time columns in black: unreadable on a dark background.
    # With 256 colors it uses a palette that shows on any.
    environment:
      TERM: xterm-256color
    network_mode: none
    read_only: true
    # GoAccess wants a writable working directory, even to print to stdout.
    working_dir: /tmp
    tmpfs:
      - /tmp
    volumes:
      - ./mnt/logs:/logs:ro
      - ./goaccess.conf:/etc/goaccess.conf:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges

  # jq for `devopsy accesslog`: it reads the access log on stdin. The
  # official image, nothing else in it; never started by `up`, pulled at
  # its first use.
  jq:
    profiles: [tools]
    image: ghcr.io/jqlang/jq:1.8.1
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges

networks:
  traefik:
    name: traefik
    external: true
