# devopsy config: see devopsy-cli's README, "Remote targets". Committed: no
# secrets and no servers here. The server comes from the address
# (devopsy @vm1:prod), or DEVOPSY_SERVER (or DEVOPSY_SERVER_<ENVIRONMENT>) in
# .devopsy/.env or the environment, like DEVOPSY_SERVER=devopsy@203.0.113.10.
# Each environment lives in <project>/<environment> under the server's
# release root, and gets <project>-<environment>.<server's wildcard domain>,
# imported from the server's proxy at each release (compose.yaml's
# devopsy.import label); override it, or set it empty for none, with:
#   devopsy @prod --vars set --show DEVOPSY_WILDCARD_DOMAIN
# Build mode, devopsy's default: a release uploads the whole project and the
# image is built on the server.
project: drupal11
secrets: [DB_PASSWORD, DRUPAL_HASH_SALT, SITE_BASIC_AUTH]
defaults:
  release: {prepare: secrets, run: deploy}
  rollback: {prepare: secrets, run: deploy}
  destroy: destroy
environments:
  # inherit: variables every child gets from prod's server files, into
  # its shared/inherit.env, on its first release, every sync and
  # --inherit (devopsy-cli's README, "Parent environments and syncs"):
  # SYNC_DATABASE, so both sides copy the database the same way
  # (compose.yaml); DB_PASSWORD, so a raw datadir (which carries prod's
  # password) and a dump (imported into a database created with it) both
  # work, and switching between them under an existing child too;
  # SITE_BASIC_AUTH, so copies of a closed site stay closed, with prod's
  # login. Unset on prod, nothing is written.
  prod:
    inherit: [SYNC_DATABASE, DB_PASSWORD, SITE_BASIC_AUTH]
  # Children: syncd from prod on their first release, before deploy, and
  # again with `devopsy @dev --sync`: files and the database's datadir
  # rsynced by devopsy with both stopped, or the database streamed
  # (SYNC_DATABASE=stream: capabilities/sync/export and import) with the
  # site running; each keeps its own shared/.env otherwise.
  dev: {parent: prod}
  "pr-*":                         # pull request environments: @pr-123
    parent: prod
    releases: {keep: 1}
