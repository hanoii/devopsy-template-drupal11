# The maintenance service (compose.yaml): every request gets index.html with
# status 503 and Retry-After, so browsers, crawlers and CDNs know it is
# temporary. nginx runs as 10001 on a read-only root filesystem: everything
# it writes goes to /tmp, a tmpfs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log off;
  server_tokens off;

  server {
    listen 8080;
    root /maintenance;

    # Every path is a 503, answered with the page: the named location
    # serves the file and keeps the status. Retry-After says the site is
    # down on purpose (the app stopped: this router answers in its place),
    # and the proxy's hold plugin lets such answers through at once.
    location / {
      return 503;
    }
    error_page 503 @maintenance;
    location @maintenance {
      rewrite ^ /index.html break;
      default_type text/html;
      types {}
      add_header Retry-After 30 always;
      add_header Cache-Control no-store always;
    }
    # The same page without Retry-After, for the app router's errors
    # middleware: the app is starting or failing, so the proxy keeps
    # retrying it for a while before showing this.
    location = /hold.html {
      error_page 503 @hold;
      return 503;
    }
    location @hold {
      rewrite ^ /index.html break;
      default_type text/html;
      types {}
      add_header Cache-Control no-store always;
    }
  }
}
