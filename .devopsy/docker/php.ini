; Production PHP settings (on top of php.ini-production).
memory_limit = 512M
; Uploads and request bodies: PHP_UPLOAD_MAX_SIZE (compose.yaml, default
; 32M), per target in .env for a site that needs larger ones.
upload_max_filesize = ${PHP_UPLOAD_MAX_SIZE:-32M}
post_max_size = ${PHP_UPLOAD_MAX_SIZE:-32M}
max_execution_time = 120
max_input_vars = 3000
expose_php = Off

; Less of PHP's request parsing for a crafted request to reach (the
; php.net advisory of October 2026, CVE-2026-109618 and CVE-2026-109619,
; recommends both even once patched): Drupal core never reports upload
; progress, and its forms nest far less than PHP's default 64.
session.upload_progress.enabled = 0
max_input_nesting_level = 32

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
; Code is immutable (a new release is a new image), and Drupal writes compiled
; Twig to new file names instead of overwriting, so nothing needs revalidating.
opcache.validate_timestamps = 0

apc.shm_size = 64M
