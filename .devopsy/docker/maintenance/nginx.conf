# The maintenance service (compose.yaml): every request gets index.html with
# status 503 and Retry-After, so browsers, crawlers and CDNs know it is
# temporary. nginx runs as 10001 on a read-only root filesystem: everything
# it writes goes to /tmp, a tmpfs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log off;
  server_tokens off;
  default_type text/html;
  charset utf-8;

  server {
    listen 8080;
    root /maintenance;

    # Every path is a 503, answered with the page. The error page is a URI,
    # not a named location: nginx then serves it as a GET whatever the
    # request's method was, so a form submitted while the app is stopped
    # gets the page too, not a 405 (its static files only answer GET and
    # HEAD). Retry-After says the site is down on purpose (the app stopped:
    # this router answers in its place), and the proxy's hold plugin lets
    # such answers through at once. Without it the proxy would hold
    # requests here too, retrying until the app's router is back or its
    # limit passes: a wait through short stops, this page after longer ones.
    error_page 503 /index.html;
    # The page's own URIs are internal: asked for from outside, a 503 too.
    error_page 404 =503 /index.html;
    location / {
      return 503;
    }
    location = /index.html {
      internal;
      add_header Retry-After 30 always;
      add_header Cache-Control no-store always;
    }

    # The same page without Retry-After, for the app router's errors
    # middleware: the app is starting or failing, so the proxy keeps
    # retrying it for a while before showing this.
    location = /hold.html {
      error_page 503 /hold/index.html;
      return 503;
    }
    location = /hold/index.html {
      internal;
      alias /maintenance/index.html;
      add_header Cache-Control no-store always;
    }
  }
}
