# GoAccess's configuration for `devopsy goaccess`: the goaccess service
# (compose.yaml) mounts it, and the command names it (-p; the official
# image looks nowhere by itself). Every option of
# its command line works here, without the dashes
# (https://goaccess.io/man#configuration); arguments to `devopsy goaccess`
# win over it. A change arrives with the next release.

# Caddy's JSON access log (docker/Caddyfile).
log-format CADDY

# What counts as a static request: the "Static Requests" panel, and what
# --ignore-statics leaves out. Everything else is "Requested Files": pages
# and PHP. Also with a query string, which Drupal adds to its CSS and
# JavaScript.
all-static-files true

# GoAccess's own list (its goaccess.conf), plus .avif. Needed whole: the
# list built into GoAccess, which a configuration file replaces, misses
# .js and .svg among others in the official image.
static-file .css
static-file .js
static-file .jpg
static-file .png
static-file .gif
static-file .ico
static-file .jpeg
static-file .pdf
static-file .csv
static-file .mpeg
static-file .mpg
static-file .swf
static-file .woff
static-file .woff2
