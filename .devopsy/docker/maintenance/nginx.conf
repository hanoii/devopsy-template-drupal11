# The maintenance service (compose.yaml): every request gets index.html with
# status 503, whatever its method (the error page is a URI, served as a GET;
# nginx's static files refuse a POST). nginx runs as 10001 on a read-only
# root filesystem: everything it writes goes to /tmp, a tmpfs.
#
# Retry-After only in maintenance mode (`devopsy maintenance on` creates
# /flag/on, mnt/maintenance/on on the host): the proxy's hold plugin lets
# such an answer through at once, the page shows while the site is down on
# purpose. Without it the proxy holds the request and retries, so a clone,
# a deploy or a failing app is a wait of up to its limit, then this page.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log off;
  server_tokens off;
  default_type text/html;
  charset utf-8;

  server {
    listen 8080;
    root /maintenance;

    error_page 503 /index.html;
    # The page's own URI is internal: asked for from outside, a 503 too.
    error_page 404 =503 /index.html;
    location / {
      return 503;
    }
    location = /index.html {
      internal;
      # add_header in an if block replaces the location's, hence both.
      if (-f /flag/on) {
        add_header Retry-After 30 always;
        add_header Cache-Control no-store always;
      }
      add_header Cache-Control no-store always;
    }
  }
}
